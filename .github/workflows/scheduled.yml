name: Scheduled

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-sudo: true
      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗️ Set up nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - name: 📦 Install cargo-fuzz
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz
      - name: 🧪 Run fuzz targets
        run: |
          host_target="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          for target in $(cargo +nightly fuzz list 2>/dev/null); do
            echo "::group::Fuzzing $target"
            cargo +nightly fuzz run --target "$host_target" "$target" -- -max_total_time=1800
            echo "::endgroup::"
          done

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    continue-on-error: true # informational deep-check; failures do not block routine changes
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-sudo: true
      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗️ Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: ⚡ Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 📦 Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-mutants
      - name: 🧪 Run mutation testing
        run: cargo mutants --workspace --timeout=120
      - name: 📦 Upload mutation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-results
          path: mutants.out/
